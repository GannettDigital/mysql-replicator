name: CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope (full is required for release evidence)
        type: choice
        options: [full, pr-smoke]
        default: full
      expanded_coverage:
        description: Legacy alias for full coverage (all test runs now collect coverage)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Stacked feature PRs target the preceding beta branch.
    branches: [main, "beta/**"]

permissions:
  contents: read
  actions: read

concurrency:
  # Unrelated labels must not cancel a running test suite.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["ci-full","ci-expanded-coverage"]'), github.event.label.name) && github.run_id || 'tests' }}
  cancel-in-progress: true

jobs:
  select-suite:
    name: Select test scope
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || contains(fromJSON('["ci-full","ci-expanded-coverage"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      expanded: ${{ steps.scope.outputs.expanded }}
      unit: ${{ steps.scope.outputs.unit }}
      periphery: ${{ steps.scope.outputs.periphery }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python3 tools/ci_scope.py
      - uses: actions/upload-artifact@v4
        with:
          name: test-selection
          overwrite: true
          path: artifacts/ci/test-selection.json
          if-no-files-found: error

  tool-tests:
    needs: select-suite
    if: needs.select-suite.outputs.scope != 'production'
    name: Python Tool Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p 'test_*.py'

  test-build:
    name: Build common Linux test artifacts
    needs: select-suite
    if: needs.select-suite.outputs.integration == 'true' && needs.select-suite.outputs.scope != 'production'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # Each compiler uses two jobs. Bound concurrent build stages too.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Select shared build cache
        id: registry
        run: python3 tools/ci_registry.py plan --image test-build
      - name: Select runtime image reference
        id: runtime
        run: python3 tools/ci_registry.py plan --image coverage
      - name: Log in to GHCR
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build application, lab, test binaries and compiler index once
        id: shared
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coverage/Dockerfile
          target: ci-build
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.publish == 'true' && steps.registry.outputs.runtime || 'mysql-replicator:test-build' }}
          push: ${{ steps.registry.outputs.publish == 'true' }}
          load: ${{ steps.registry.outputs.publish != 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ steps.registry.outputs.source }}
          cache-from: ${{ steps.registry.outputs.cache_from }}
          cache-to: ${{ steps.registry.outputs.cache_to }}
      - name: Export the lab from the common build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coverage/Dockerfile
          target: ci-export
          platforms: linux/amd64
          outputs: type=local,dest=artifacts/ci
          cache-from: ${{ steps.registry.outputs.cache_from }}
      - name: Read source input identity
        id: lab
        run: cat artifacts/ci/ci-inputs >> "$GITHUB_OUTPUT"
      - name: Export the runtime from the same compiled build
        id: coverage-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coverage/Dockerfile
          target: runtime
          platforms: linux/amd64
          tags: ${{ steps.runtime.outputs.publish == 'true' && steps.runtime.outputs.runtime || 'mysql-replicator:coverage' }}
          push: ${{ steps.runtime.outputs.publish == 'true' }}
          load: ${{ steps.runtime.outputs.publish != 'true' }}
          labels: |
            org.mysql-replicator.coverage-inputs=${{ steps.lab.outputs.inputs }}
            org.opencontainers.image.source=${{ steps.runtime.outputs.source }}
          # The same BuildKit instance has already compiled the build stage.
          cache-from: ${{ steps.registry.outputs.cache_from }}
      - name: Record immutable shared build
        if: steps.registry.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.registry.outputs.runtime }}
          IMAGE_DIGEST: ${{ steps.shared.outputs.digest }}
        run: python3 tools/ci_registry.py record --image test-build --directory artifacts/ci/test-build
      - name: Record immutable runtime
        if: steps.runtime.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.runtime.outputs.runtime }}
          IMAGE_DIGEST: ${{ steps.coverage-runtime.outputs.digest }}
        run: python3 tools/ci_registry.py record --image coverage
      - name: Save images for forks without registry write access
        if: steps.registry.outputs.publish != 'true'
        run: |
          mkdir -p artifacts/ci/test-build artifacts/ci/image
          docker save mysql-replicator:test-build | gzip -1 > artifacts/ci/test-build/image.tar.gz
          (cd artifacts/ci/test-build && sha256sum image.tar.gz > SHA256SUMS)
          docker save mysql-replicator:coverage | gzip -1 > artifacts/ci/image/image.tar.gz
          (cd artifacts/ci/image && sha256sum image.tar.gz > SHA256SUMS)
      - name: Record runtime build identity
        run: python3 tools/ci_reruns.py identity --image coverage --output artifacts/ci/image/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-prebuilt-lab
          overwrite: true
          path: |
            artifacts/ci/prebuilt-lab.tar.gz
            artifacts/ci/prebuilt-lab.tar.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-test-build
          overwrite: true
          path: artifacts/ci/test-build/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ci-build-coverage
          overwrite: true
          path: artifacts/ci/image/build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-coverage
          overwrite: true
          path: artifacts/ci/image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  unit-tests:
    needs: [select-suite, test-build]
    if: needs.select-suite.outputs.unit == 'true'
    name: Unit Tests & Catalog Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image-test-build
          path: artifacts/ci/test-build
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load the common build by digest
        run: python3 tools/ci_test_build.py load
      - name: Run prebuilt Rust and Swift unit tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p artifacts/coverage
          docker run --rm --platform linux/amd64 -v "$PWD/artifacts/coverage:/workspace/artifacts/coverage" \
            mysql-replicator:test-build bash -e -c '
              python3 tools/release_version.py
              python3 tools/ci_test_build.py rust-test
              timeout --signal=TERM --kill-after=15s 5m stdbuf -oL -eL python3 -u tools/code_coverage.py unit --prebuilt
              python3 tools/syntax_tests.py --coverage --skip-build
              .build/release/replicator-lab ddl-catalog check
              SWIFT_CACHE_INTEGRATION=1 python3 -m unittest discover -s tools -p test_swift_cache.py
            ' 2>&1 | tee artifacts/coverage/unit-tests.log
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          overwrite: true
          path: artifacts/coverage/unit-tests.log
          if-no-files-found: warn
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          overwrite: true
          path: artifacts/coverage/unit/coverage.json
          if-no-files-found: error
      - name: Upload isolated SQL syntax coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-syntax-unit-coverage
          overwrite: true
          path: artifacts/coverage/syntax-unit/
          if-no-files-found: error

  lab-tools:
    needs: [select-suite, test-build]
    if: always() && !cancelled() && needs.select-suite.outputs.integration == 'true' && (needs.test-build.result == 'success' || needs.select-suite.outputs.scope == 'production')
    name: Prepare lab runner and test plan
    runs-on: ubuntu-24.04
    outputs:
      inputs: ${{ steps.bundle.outputs.inputs }}
      matrix: ${{ steps.bundle.outputs.matrix }}
      coverage_reports: ${{ steps.bundle.outputs.coverage_reports }}
      images: ${{ steps.bundle.outputs.images }}
      scope: ${{ steps.bundle.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - name: Download changed-file test selection
        uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: artifacts/ci/
      # Keep toolchain headers and their consuming objects in the SAME archive.
      # setup-swift copies files on a cold install, giving headers new mtimes.
      - name: Identify runner image
        if: needs.select-suite.outputs.scope == 'production'
        id: runner-image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore Swift toolchain and build cache
        if: needs.select-suite.outputs.scope == 'production'
        uses: actions/cache@v4
        with:
          path: |
            .build/ci-lab
            ${{ runner.tool_cache }}/swift-Ubuntu/6.2.1
          key: lab-${{ runner.os }}-${{ runner.arch }}-swift6.2.1-v2-${{ steps.runner-image.outputs.id }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            lab-${{ runner.os }}-${{ runner.arch }}-swift6.2.1-v2-${{ steps.runner-image.outputs.id }}-${{ hashFiles('Package.resolved') }}-
      - uses: swift-actions/setup-swift@v2
        if: needs.select-suite.outputs.scope == 'production'
        with:
          swift-version: '6.2.1'
      - name: Build lab for production package checks
        if: needs.select-suite.outputs.scope == 'production'
        run: |
          python3 tools/swift_cache.py restore --scratch-path .build/ci-lab
          swift build --scratch-path .build/ci-lab --product replicator-lab --force-resolved-versions
          python3 tools/swift_cache.py save --scratch-path .build/ci-lab
      - uses: actions/download-artifact@v4
        if: needs.select-suite.outputs.scope != 'production'
        with:
          name: ci-prebuilt-lab
          path: artifacts/ci/
      - name: Unpack the prebuilt test lab
        if: needs.select-suite.outputs.scope != 'production'
        run: |
          cd artifacts/ci
          sha256sum --check prebuilt-lab.tar.sha256
          tar -xzf prebuilt-lab.tar.gz
      - name: Bundle the lab and select tests
        id: bundle
        env:
          CI_SUITE: ${{ needs.select-suite.outputs.scope }}
          CI_EXPANDED_COVERAGE: ${{ needs.select-suite.outputs.expanded }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/ci/prebuilt-lab/swift/linux
        run: |
          if [ "$CI_SUITE" = production ]; then
            python3 tools/ci_lab.py --bundle .build/ci-lab/debug/replicator-lab
          else
            python3 tools/ci_lab.py --bundle artifacts/ci/prebuilt-lab/replicator-lab
          fi
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-lab
          path: |
            artifacts/ci/lab.tar.gz
            artifacts/ci/lab.sha256
            artifacts/ci/matrix.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  build-images:
    name: Prepare ${{ matrix.image }} runtime
    permissions:
      contents: read
      packages: write
      actions: read
    needs: lab-tools
    if: ${{ !cancelled() && needs.lab-tools.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.lab-tools.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: matrix.image == 'release'
      - name: Select registry caches and runtime reference
        if: matrix.image == 'release'
        id: registry
        env:
          BUILD_IMAGE: ${{ matrix.image }}
        run: python3 tools/ci_registry.py plan --image "$BUILD_IMAGE"
      - name: Log in to GHCR
        if: matrix.image == 'release' && steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify Linux packages
        if: matrix.image == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/packaging/Dockerfile
          target: release-export
          platforms: linux/amd64
          outputs: type=local,dest=artifacts/release
          cache-from: ${{ steps.registry.outputs.cache_from }}
          cache-to: ${{ steps.registry.outputs.cache_to }}
      - name: Export the tested release runtime
        id: release-runtime
        if: matrix.image == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/packaging/Dockerfile
          target: runtime
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.publish == 'true' && steps.registry.outputs.runtime || 'mysql-replicator-packaging:lab' }}
          push: ${{ steps.registry.outputs.publish == 'true' }}
          labels: |
            org.mysql-replicator.coverage-inputs=${{ needs.lab-tools.outputs.inputs }}
            org.opencontainers.image.source=${{ steps.registry.outputs.source }}
          load: true
          # A cached package export need not populate the builder's intermediate
          # layers. This separate target must import the external cache too.
          cache-from: ${{ steps.registry.outputs.cache_from }}
      - name: Tag loaded release image for local checks
        if: matrix.image == 'release' && steps.registry.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.registry.outputs.runtime }}
        run: docker tag "$IMAGE_REFERENCE" mysql-replicator-packaging:lab
      - name: Verify production image and identical integration binary
        if: matrix.image == 'release'
        run: |
          make release-image
          python3 tools/verify_release_binary.py
      - name: Reuse runtime from the common test build
        if: matrix.image == 'coverage'
        uses: actions/download-artifact@v4
        with:
          name: ci-build-coverage
          path: artifacts/ci/image
      - name: Check reused runtime identity
        if: matrix.image == 'coverage'
        run: python3 tools/ci_test_build.py check-runtime
      - name: Record immutable runtime image
        if: matrix.image == 'release' && steps.registry.outputs.publish == 'true'
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          IMAGE_REFERENCE: ${{ steps.registry.outputs.runtime }}
          IMAGE_DIGEST: ${{ steps.release-runtime.outputs.digest }}
        run: python3 tools/ci_registry.py record --image "$BUILD_IMAGE"
      - name: Save image for test jobs without registry write access
        if: matrix.image == 'release' && steps.registry.outputs.publish != 'true'
        env:
          IMAGE: ${{ matrix.image == 'release' && 'mysql-replicator-packaging:lab' || 'mysql-replicator:coverage' }}
        run: |
          mkdir -p artifacts/ci/image
          docker save "$IMAGE" | gzip -1 > artifacts/ci/image/image.tar.gz
          cd artifacts/ci/image
          sha256sum image.tar.gz > SHA256SUMS
      - name: Record the build identity for reused test results
        if: matrix.image == 'release'
        env:
          BUILD_IMAGE: ${{ matrix.image }}
        run: python3 tools/ci_reruns.py identity --image "$BUILD_IMAGE" --output artifacts/ci/image/build.json
      - uses: actions/upload-artifact@v4
        if: matrix.image == 'release'
        with:
          overwrite: true
          name: ci-build-${{ matrix.image }}
          path: artifacts/ci/image/build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.image == 'release'
        with:
          overwrite: true
          name: ci-image-${{ matrix.image }}
          path: artifacts/ci/image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.image == 'release'
        with:
          overwrite: true
          name: linux-release-packages
          path: artifacts/release/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.image == 'release'
        with:
          overwrite: true
          name: release-package-checksums
          path: artifacts/release/SHA256SUMS
          if-no-files-found: error

  integration:
    name: Integration / ${{ matrix.profile }} / ${{ matrix.area }} / ${{ matrix.variant }} / ${{ matrix.image }}
    permissions:
      contents: read
      packages: read
      actions: read
    needs: [lab-tools, build-images]
    if: ${{ !cancelled() && needs.lab-tools.result == 'success' && needs.build-images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.lab-tools.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-lab
          path: artifacts/ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-image-${{ matrix.image }}
          path: artifacts/ci/image
      - uses: actions/download-artifact@v4
        if: matrix.image == 'release'
        with:
          name: linux-release-packages
          path: artifacts/release
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and load prebuilt tools
        env:
          BUILD_IMAGE: ${{ matrix.image }}
        run: |
          (cd artifacts/ci && sha256sum --check lab.sha256 && tar -xzf lab.tar.gz)
          if [ -f artifacts/ci/image/image.json ]; then
            python3 tools/ci_registry.py load --image "$BUILD_IMAGE"
          else
            (cd artifacts/ci/image && sha256sum --check SHA256SUMS && docker load --input image.tar.gz)
          fi
      - name: Install integration test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 openssl zlib1g libstdc++6
      - name: Set up MySQL 8.4 reference decoder
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --show-error --location --retry 3 \
            https://repo.mysql.com/apt/ubuntu/pool/mysql-8.4-lts/m/mysql-community/mysql-community-server-core_8.4.8-1ubuntu24.04_amd64.deb \
            --output mysql-server-core.deb
          echo 'ba41bfb4ad355ded41c15b1280c36701149931019c9fd7529785d45bd34afd78  mysql-server-core.deb' | sha256sum --check
          dpkg-deb --extract mysql-server-core.deb mysql-reference
          "$RUNNER_TEMP/mysql-reference/usr/bin/mysqlbinlog" --no-defaults --version
          echo "MYSQLBINLOG=$RUNNER_TEMP/mysql-reference/usr/bin/mysqlbinlog" >> "$GITHUB_ENV"
      - name: Run isolated test groups
        env:
          CI_JOB: ${{ matrix.id }}
        run: python3 tools/ci_lab.py --run-job "$CI_JOB"
      - name: Upload execution group measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: ci-measurement-${{ matrix.id }}
          path: artifacts/ci/measurements/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.reports > 0
        with:
          overwrite: true
          name: coverage-integration-${{ matrix.id }}
          path: |
            artifacts/lab/**/code-coverage/combined/coverage.json
            !artifacts/lab/**/evidence-*/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: integration-evidence-${{ matrix.id }}
          path: |
            artifacts/lab/
            artifacts/reverse-suite/
            artifacts/native-ddl-suite/
          if-no-files-found: ignore

  packaging-and-smoke:
    # Preserve the required check name. Production scope checks packages after merge.
    name: Selected CI Checks
    needs: [select-suite, test-build, tool-tests, unit-tests, periphery, swift-lint, lab-tools, build-images, integration]
    if: always() && needs.select-suite.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require all selected checks
        env:
          SELECTED_SCOPE: ${{ needs.select-suite.outputs.scope }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci_scope.py --check-results

  combined-coverage:
    name: Combined Swift Coverage
    needs: [lab-tools, unit-tests, packaging-and-smoke]
    if: always() && !cancelled() && needs.lab-tools.result != 'skipped' && needs.lab-tools.outputs.scope != 'production'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: artifacts/coverage/downloaded
      - uses: actions/download-artifact@v4
        with:
          name: ci-lab
          path: artifacts/ci
      - name: Combine line coverage
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.packaging-and-smoke.result }}
          EXPECTED_REPORTS: ${{ needs.lab-tools.outputs.coverage_reports }}
          CI_SUITE: ${{ needs.lab-tools.outputs.scope }}
        run: |
          python3 tools/coverage_report.py --ci --matrix artifacts/ci/matrix.json \
            --downloaded artifacts/coverage/downloaded \
            --unit-result "$UNIT_RESULT" \
            --integration-result "$INTEGRATION_RESULT" \
            --expected-integration "${EXPECTED_REPORTS:-0}"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: combined-swift-coverage
          path: artifacts/coverage/combined/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: coverage-summary
          path: artifacts/coverage/combined/metrics.json
          if-no-files-found: error

  swift-lint:
    needs: select-suite
    if: needs.select-suite.outputs.scope != 'production'
    name: Swift Syntax and Format
    runs-on: ubuntu-24.04
    container: swift:6.2.1-jammy@sha256:6e33c70a59180c9b518f67728538312975cb3891177d20215cd2e31bdfe70791
    steps:
      - uses: actions/checkout@v4
      # The Swift SDK image has the formatter, but does not include make.
      - run: swift format lint --strict --parallel --recursive Sources tests

  periphery:
    needs: [select-suite, test-build]
    if: needs.select-suite.outputs.periphery == 'true'
    name: Unused Swift Code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image-test-build
          path: artifacts/ci/test-build
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load the common build by digest
        run: python3 tools/ci_test_build.py load
      - name: Reject unused declarations with the shared compiler index
        run: |
          docker run --rm --platform linux/amd64 mysql-replicator:test-build \
            periphery scan --strict --skip-build --index-store-path .build/release/index/store

  measurements:
    name: Timing & Profile Coverage Report
    needs: [lab-tools, unit-tests, packaging-and-smoke, combined-coverage, periphery, swift-lint]
    if: always() && !cancelled() && needs.lab-tools.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-lab
          path: artifacts/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-measurement-*-*
          path: artifacts/ci/downloaded-measurements
      - uses: actions/download-artifact@v4
        if: needs.lab-tools.outputs.scope != 'production'
        with:
          name: coverage-unit
          path: artifacts/ci/unit
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-build-*
          path: artifacts/ci/builds
      # Timing is diagnostic. Required results come from `needs` and the
      # same-run artifacts, whose uploads must succeed in each test job.
      - name: Read optional job timing with retries
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci_reruns.py jobs --output artifacts/ci/jobs.json
      - name: Report timing, catalog results and profile line coverage
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_SUITE: ${{ needs.lab-tools.outputs.scope }}
        run: |
          extra=()
          if [ "$CI_SUITE" != production ]; then extra+=(--unit-coverage artifacts/ci/unit/coverage.json); fi
          python3 tools/ci_measurements.py --matrix artifacts/ci/matrix.json \
            --records artifacts/ci/downloaded-measurements --jobs artifacts/ci/jobs.json --builds artifacts/ci/builds \
            "${extra[@]}" --optional-job-timings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: ci-measurement-report
          path: artifacts/ci/report/
          if-no-files-found: error

  full-test-evidence:
    name: Full Suite / Test Evidence
    needs: [lab-tools, unit-tests, packaging-and-smoke, combined-coverage, periphery, swift-lint, measurements]
    if: always() && !cancelled() && needs.lab-tools.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-measurement-report
          path: artifacts/ci/report
      - name: Record full test results and source tree
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/release_evidence.py create
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: full-test-evidence
          path: artifacts/ci/full-test-evidence.json
          retention-days: 90
          if-no-files-found: error

  tested-source:
    name: Match merged source to full tests
    needs: select-suite
    if: needs.select-suite.outputs.scope == 'production'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find successful full tests for this Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_evidence.py find-tests
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: tested-source
          path: artifacts/ci/tested-source.json
          if-no-files-found: error

  release-evidence:
    name: Production Packages / Release Evidence
    needs: [lab-tools, packaging-and-smoke, measurements, tested-source]
    if: always() && !cancelled() && needs.lab-tools.outputs.scope == 'production'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-measurement-report
          path: artifacts/ci/report
      - uses: actions/download-artifact@v4
        with:
          name: release-package-checksums
          path: artifacts/release
      - uses: actions/download-artifact@v4
        with:
          name: tested-source
          path: artifacts/ci
      - name: Link full tests and the exact production packages
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/release_evidence.py create
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: release-test-evidence
          path: artifacts/release/release-test-evidence.json
          retention-days: 90
          if-no-files-found: error
