name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Stacked feature PRs target the preceding beta branch.
    branches: [main, "beta/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests & Catalog Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'

      - name: Check release version consistency
        run: python3 tools/release_version.py

      - name: Run unit test suites
        run: make coverage-unit

      - name: Test coverage report tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          overwrite: true
          path: artifacts/coverage/unit/coverage.json
          if-no-files-found: error

      - name: Verify DDL coverage catalog
        run: make ddl-catalog-check

  packaging-and-smoke:
    name: Debian Packaging & Integration Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'

      - name: Build and verify Linux release packages
        run: make release-artifacts

      - name: Build and verify the production image from the release archive
        run: make release-image

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: |
            artifacts/release/
          if-no-files-found: error

      - name: Install integration test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 openssl zlib1g libstdc++6

      - name: Set up MySQL 8.4 reference decoder
        run: |
          # mysqlbinlog ships in server-core; extract it without installing a server.
          # Match the 8.4.8 fixtures, independent of Ubuntu's default MySQL version.
          cd "$RUNNER_TEMP"
          curl --fail --show-error --location --retry 3 \
            https://repo.mysql.com/apt/ubuntu/pool/mysql-8.4-lts/m/mysql-community/mysql-community-server-core_8.4.8-1ubuntu24.04_amd64.deb \
            --output mysql-server-core.deb
          echo 'ba41bfb4ad355ded41c15b1280c36701149931019c9fd7529785d45bd34afd78  mysql-server-core.deb' | sha256sum --check
          dpkg-deb --extract mysql-server-core.deb mysql-reference
          "$RUNNER_TEMP/mysql-reference/usr/bin/mysqlbinlog" --no-defaults --version
          echo "MYSQLBINLOG=$RUNNER_TEMP/mysql-reference/usr/bin/mysqlbinlog" >> "$GITHUB_ENV"

      - name: Run DML and DDL integration sample
        run: make integration-smoke

      - name: Verify integration exercised the release binary
        run: python3 tools/verify_release_binary.py

      - name: Run the same correctness smoke on both profiles
        run: |
          make correctness TIER=smoke ARGS="--skip-build"

      - name: Qualify source and target reconnect on both profiles
        run: make lab-test ARGS="--suite lifecycle --skip-build"

      - name: Retain specialized reverse recovery qualification
        run: |
          docker tag mysql-replicator-packaging:lab mysql-replicator-packaging:reverse
          make reverse-suite ARGS="--skip-build --events 0"

      - name: Measure applier coverage on DML and DDL sample
        run: make integration-smoke ARGS="--coverage"

      - name: Measure shared applier coverage on both profiles
        run: make correctness TIER=smoke ARGS="--coverage --skip-build"

      - name: Qualify shared demos and measure their applier coverage on both profiles
        run: make lab-test ARGS="--suite demo --coverage --skip-build"

      - name: Upload portable integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          overwrite: true
          path: |
            artifacts/lab/**/code-coverage/combined/coverage.json
          if-no-files-found: error

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            artifacts/lab/
            artifacts/reverse-suite/
          if-no-files-found: ignore

  combined-coverage:
    name: Combined Swift Coverage
    needs: [unit-tests, packaging-and-smoke]
    # Preserve useful partial evidence on failure, but do not call it complete.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: artifacts/coverage/downloaded
      - name: Combine line coverage
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.packaging-and-smoke.result }}
        run: |
          # Sample + two profile smoke runs + four forward/five reverse demo sessions.
          # Discovery excludes archived demo evidence copies; originals stay strict.
          python3 tools/coverage_report.py --ci \
            --downloaded artifacts/coverage/downloaded \
            --unit-result "$UNIT_RESULT" \
            --integration-result "$INTEGRATION_RESULT" \
            --expected-integration 12
      - uses: actions/upload-artifact@v4
        with:
          name: combined-swift-coverage
          overwrite: true
          path: artifacts/coverage/combined/
          if-no-files-found: error

      - name: Upload small PR summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          overwrite: true
          path: artifacts/coverage/combined/metrics.json
          if-no-files-found: error

  periphery:
    name: Unused Swift Code
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Install pinned Periphery
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --show-error --location --retry 3 \
            https://github.com/peripheryapp/periphery/releases/download/3.5.1/periphery-3.5.1.artifactbundle.zip \
            --output periphery.zip
          echo '55beee48bde34390cd6cb8dd4eca762c2646d7d0b58631fd2f00b15898e194d6  periphery.zip' | shasum -a 256 --check
          unzip -q periphery.zip
          echo "$RUNNER_TEMP/periphery-3.5.1.artifactbundle/periphery-3.5.1-macos/bin" >> "$GITHUB_PATH"
      - name: Reject unused declarations
        run: make periphery
