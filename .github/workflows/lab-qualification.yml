name: Full Profile Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correctness:
    name: Full correctness (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [mysql84-to-mysql57-myisam, mysql57-to-mysql84-innodb]
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 openssl
      - name: Run shared full correctness
        run: make correctness PROFILE=${{ matrix.profile }}
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.profile }}
          path: artifacts/lab/
          if-no-files-found: error
