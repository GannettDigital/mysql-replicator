name: Full Profile Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  inputs:
    name: Reuse exact main CI builds
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Find successful CI with retained artifacts for this commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/qualification_inputs.py

  correctness:
    name: Full correctness (${{ matrix.profile }}, ${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mysql84-to-mysql57-myisam
            variant: default
          - profile: mysql57-to-mysql84-innodb
            variant: default
          - profile: mysql84-to-mysql57-myisam
            variant: position-minimal
          - profile: mysql84-to-mysql57-myisam
            variant: gtid-full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-lab
          path: artifacts/ci
          run-id: ${{ needs.inputs.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-image-release
          path: artifacts/ci/image
          run-id: ${{ needs.inputs.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and load prebuilt tools
        run: |
          cd artifacts/ci
          sha256sum --check lab.sha256
          tar -xzf lab.tar.gz
          cd image
          sha256sum --check SHA256SUMS
          docker load --input image.tar.gz
      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 openssl zlib1g libstdc++6
      - name: Set up MySQL 8.4 reference decoder
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --show-error --location --retry 3 \
            https://repo.mysql.com/apt/ubuntu/pool/mysql-8.4-lts/m/mysql-community/mysql-community-server-core_8.4.8-1ubuntu24.04_amd64.deb \
            --output mysql-server-core.deb
          echo 'ba41bfb4ad355ded41c15b1280c36701149931019c9fd7529785d45bd34afd78  mysql-server-core.deb' | sha256sum --check
          dpkg-deb --extract mysql-server-core.deb mysql-reference
          "$RUNNER_TEMP/mysql-reference/usr/bin/mysqlbinlog" --no-defaults --version
          echo "MYSQLBINLOG=$RUNNER_TEMP/mysql-reference/usr/bin/mysqlbinlog" >> "$GITHUB_ENV"
      - name: Run shared full correctness
        env:
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: python3 tools/ci_lab.py --qualification correctness --profile "$PROFILE" --variant "$VARIANT"
      - name: Run shared source and target lifecycle
        env:
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: python3 tools/ci_lab.py --qualification lifecycle --profile "$PROFILE" --variant "$VARIANT"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.profile }}-${{ matrix.variant }}
          path: artifacts/lab/
          if-no-files-found: error
