name: Measure one build

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      phase:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build:
    name: ${{ inputs.image }} / ${{ inputs.phase }} cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select this experiment's registry cache
        id: registry
        env:
          BUILD_IMAGE: ${{ inputs.image }}
          BUILD_PHASE: ${{ inputs.phase }}
        run: python3 tools/ci_registry.py study --image "$BUILD_IMAGE" --phase "$BUILD_PHASE"
      - name: Start build clock
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build Linux packages
        if: inputs.image == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/packaging/Dockerfile
          target: release-export
          platforms: linux/amd64
          outputs: type=local,dest=artifacts/release
          no-cache: ${{ inputs.phase == 'cold' }}
          cache-from: ${{ steps.registry.outputs.cache_from }}
          cache-to: ${{ steps.registry.outputs.cache_to }}
      - name: Build coverage runtime
        if: inputs.image == 'coverage'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coverage/Dockerfile
          platforms: linux/amd64
          tags: mysql-replicator:coverage-study
          load: true
          no-cache: ${{ inputs.phase == 'cold' }}
          cache-from: ${{ steps.registry.outputs.cache_from }}
          cache-to: ${{ steps.registry.outputs.cache_to }}
      - name: Record build result
        if: always()
        env:
          BUILD_IMAGE: ${{ inputs.image }}
          BUILD_PHASE: ${{ inputs.phase }}
          CACHE_HIT: ${{ steps.registry.outputs.cache_hit }}
          CACHE_BACKEND: registry-layers
          BUILD_STATUS: ${{ job.status }}
        run: python3 tools/ci_cache_study.py record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-measurement-${{ inputs.image }}-${{ inputs.phase }}
          path: artifacts/ci/cache-study/*.json
          if-no-files-found: error
