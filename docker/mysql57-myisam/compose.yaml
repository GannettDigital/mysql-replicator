# MySQL 5.7 InnoDB source, 5.7 MyISAM native reference and applier target.
services:
  source:
    image: mysql-replicator-fixture:5.7.42-setpriv
    platform: linux/amd64
    build: ./docker/mysql57
    command: ["--server-id=5701", "--log-bin=binlog", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-checksum=CRC32", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--sync-binlog=1", "--innodb-flush-log-at-trx-commit=1", "--innodb-use-native-aio=0", "--explicit-defaults-for-timestamp=ON", "--skip-slave-start", "--ssl-ca=/evidence/tls/ca.pem", "--ssl-cert=/evidence/tls/server.pem", "--ssl-key=/evidence/tls/server-key.pem", "--require-secure-transport=ON"]
    volumes: ["mysql57-evidence:/evidence:ro"]
  native:
    image: mysql-replicator-fixture:5.7.42-setpriv
    platform: linux/amd64
    build: ./docker/mysql57
    command: ["--server-id=5702", "--disabled-storage-engines=${FIXTURE_DISABLED_ENGINES:-}", "--log-bin=binlog", "--log-slave-updates=ON", "--relay-log=relay-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-checksum=CRC32", "--gtid-mode=OFF_PERMISSIVE", "--enforce-gtid-consistency=WARN", "--slave-parallel-workers=0", "--slave-exec-mode=STRICT", "--sync-binlog=1", "--innodb-flush-log-at-trx-commit=1", "--innodb-use-native-aio=0", "--explicit-defaults-for-timestamp=ON", "--skip-slave-start", "--ssl-ca=/evidence/tls/ca.pem", "--ssl-cert=/evidence/tls/server.pem", "--ssl-key=/evidence/tls/server-key.pem"]
    volumes: ["mysql57-evidence:/evidence:ro"]
  target57:
    command: ["--server-id=5703", "--disabled-storage-engines=${FIXTURE_DISABLED_ENGINES:-}", "--log-bin=binlog", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-checksum=CRC32", "--gtid-mode=OFF_PERMISSIVE", "--enforce-gtid-consistency=WARN", "--sync-binlog=1", "--innodb-flush-log-at-trx-commit=1", "--innodb-use-native-aio=0", "--explicit-defaults-for-timestamp=ON", "--skip-slave-start", "--ssl-ca=/evidence/tls/ca.pem", "--ssl-cert=/evidence/tls/server.pem", "--ssl-key=/evidence/tls/server-key.pem", "--require-secure-transport=ON"]
    volumes: ["mysql57-evidence:/evidence:ro"]
volumes:
  mysql57-evidence:
    external: true
    name: "${REPLICATOR_MYSQL57_EVIDENCE_VOLUME:?evidence volume required}"
